# Workspace configuration template.
#
# Copy to `workspace.yaml`, edit, then run `make setup`.
# workspace.yaml itself is .gitignored — each checkout sets its own.

# CLI binary name (used for `make install-cli` symlink, vector index name,
# MCP server name, and state directory).
name: workspace-docs

# Default git host. Entries under `repos:` without an explicit `url` will be
# cloned from `${git_host}/<name>.git`. Comment out if you pre-clone repos
# into ./repos/ yourself.
git_host: git@github.com:your-org

embeddings:
  # OpenAI-compatible /v1/embeddings endpoint. Works with LM Studio, Ollama,
  # llama-server, vLLM, the OpenAI API, etc.
  api_url: http://localhost:1234/v1/embeddings
  model: text-embedding-nomic-embed-text-v1.5
  dimension: 768
  batch_size: 64
  concurrency: 4

# Each repo has a `name` and a `type`:
#   spec — documentation, design specs, public API surfaces
#   impl — real-world implementation / usage code (examples_search filters to these)
# Optional per-repo fields:
#   url    — full clone URL (overrides git_host)
#   branch — branch to check out after cloning
repos:
  - { name: my-docs, type: spec }
  - { name: design-system, type: spec }
  - { name: api-contracts, type: spec }
  - { name: my-app, type: impl }
  - { name: my-api, type: impl }
  - { name: external-lib, type: impl, url: git@github.com:other-org/external-lib.git, branch: develop }

# Optional plugins. Each entry needs `enabled: true` to load. Built-in plugins:
#   xmlspec — XmlSpec XML validate / lint / explain MCP tools (example-org/Orbit specific)
plugins:
  xmlspec:
    enabled: false
    spec_dir: repos/design-system/specs
