name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tools/dsl_indexer/config.py calls load_config() at import time, so the
      # package cannot be imported without a workspace.yaml. See README
      # "Known limitations".
      - name: Provide a workspace config
        run: cp workspace.example.yaml workspace.yaml

      - name: Install dependencies
        run: uv sync --project tools/mcp_docs_server --group dev

      - name: Run tests
        run: uv run --project tools/mcp_docs_server --group dev python -m pytest -q

      - name: AGENTS.md symlink resolves to CLAUDE.md
        run: |
          target="$(readlink AGENTS.md)"
          test "$target" = "CLAUDE.md" || { echo "AGENTS.md -> $target, expected CLAUDE.md"; exit 1; }
          test -f AGENTS.md || { echo "AGENTS.md symlink dangles"; exit 1; }
